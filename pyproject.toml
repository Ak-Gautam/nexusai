[project]
name = "nexus"
version = "0.1.0"
description = "Nexus local-first macOS agentic assistant backend"
readme = "reamed.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nexus-backend = "nexus_backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_backend"]

[tool.uv]
package = true
